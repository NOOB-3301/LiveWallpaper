[package]
name = "scene_renderer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lean Metal renderer for Wallpaper Engine scene packages"

# The bindgen binary is a separate member so its dependencies stay out of the library.
[workspace]
members = ["uniffi-bindgen"]

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
block2 = "0.6.2"
naga = { version = "29.0.3", features = ["glsl-in", "msl-out"] }
serde_json = "1.0"
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
objc2 = { version = "0.6.4", features = ["exception"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
objc2-quartz-core = "0.3.2"
# SceneScript (JavaScript on scene properties): QuickJS, MIT, small and embeddable.
rquickjs = { version = "0.9.0", features = ["loader"] }
uniffi = "0.28.3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = true
codegen-units = 1

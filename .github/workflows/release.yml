name: release

# Builds the app, packs a DMG and, for a version tag, attaches it (with its SHA-256) to a GitHub Release.
#   git tag v1.2.3 && git push origin v1.2.3        -> release
#   Actions > release > Run workflow                  -> dry run: same build, the DMG is only uploaded as an artifact
# The app is signed ad hoc and NOT notarized (no Apple Developer account); README.md explains the first launch.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version written into the Info.plists for a dry run (digits and dots)'
        default: '0.0.0'
        required: true
      universal:
        description: 'Build arm64 + x86_64'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  dmg:
    # macos-26: the macOS 26 SDK has the Core Audio tap API the service uses for audio response.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION:-0.0.0}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::'$VERSION' is not a version (use digits and dots, tag like v1.2.3)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      # Restore before installing the toolchain so a cached ~/.cargo/bin cannot overwrite a newer rustup.
      - name: Cache cargo registry and scene renderer
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            SceneRenderer/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('SceneRenderer/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Ensure stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin

      # The scene renderer, built and bindgen'd for Swift. It must come before `swift test`, because
      # SwiftPM builds every target of the package.
      - name: Build the scene renderer
        run: scripts/build-scene-renderer.sh

      - name: Tests (Core and SceneFormat)
        run: swift test

      - name: Build and assemble the app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          UNIVERSAL_INPUT: ${{ inputs.universal }}
        run: |
          # Tags and unset inputs build arm64 only; the input adds the x86_64 slice (build.sh passes it on
          # to the renderer build, which merges both static libraries).
          if [[ "$UNIVERSAL_INPUT" == "true" ]]; then export UNIVERSAL=1; else export UNIVERSAL=0; fi
          ./build.sh

      - name: Verify the bundle
        run: scripts/verify-bundle.sh build/PaperFlow.app "${{ steps.version.outputs.version }}"

      - name: Make the DMG
        run: scripts/make-dmg.sh build/PaperFlow.app "${{ steps.version.outputs.version }}"

      - name: Upload the DMG (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PaperFlow-${{ steps.version.outputs.version }}-dmg
          path: |
            dist/PaperFlow-${{ steps.version.outputs.version }}.dmg
            dist/PaperFlow-${{ steps.version.outputs.version }}.dmg.sha256
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > release-notes.md <<'NOTES'
          Renamed from Live Wallpaper. Your library, playlists and settings carry over and permissions stay
          granted, because the app keeps its original bundle identifier. After installing, delete
          `/Applications/LiveWallpaper.app` so macOS cannot launch or update the older copy.

          Ad-hoc signed, not notarized. On first launch macOS will say it cannot verify the app:
          open System Settings > Privacy & Security, scroll down and press "Open Anyway" once, or run
          `xattr -dr com.apple.quarantine /Applications/PaperFlow.app` in Terminal. Details are in the README.

          Verify the download with the `.sha256` file: `shasum -a 256 -c PaperFlow-__VERSION__.dmg.sha256`.

          Not affiliated with Valve or Wallpaper Engine. Steam downloads use Valve's own SteamCMD with your own account.
          NOTES
          sed -i '' "s/__VERSION__/$VERSION/g" release-notes.md
          FILES=("dist/PaperFlow-$VERSION.dmg" "dist/PaperFlow-$VERSION.dmg.sha256")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --title "PaperFlow $VERSION" \
              --notes-file release-notes.md --generate-notes
          fi
